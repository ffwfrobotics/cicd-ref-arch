# The example stack (docs/stacks.md): cicd-ref-arch's platform layer as a cluster. The platform repo is
# the submodule platform/, pinned: the stack runs exactly that commit of it.
apiVersion: cicd.ffwf.net/v1alpha1
kind: Stack
metadata: {name: stack-ref}
spec:
  provider: k0s-pod
  definition: cluster
  check: {timeout: 900s, minKustomizations: 6}
  environments:
    dev: {branch: main, target: nested}

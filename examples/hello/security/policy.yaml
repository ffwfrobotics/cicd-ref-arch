# The app's security records: suppressions with a reason and an expiry date, and anything it wants
# stricter than the platform's floor (security/policy.yaml in cicd-ref-arch). Never loosens it.
apiVersion: cicd.ffwf.net/v1alpha1
kind: SecurityPolicy
ignore:
- rule: CKV_DOCKER_7
  path: "*/Dockerfile:*"
  reason: "false positive: FROM ${BASE} is an ARG pinned by digest, which checkov cannot resolve"
  expires: 2027-05-19
- rule: CKV_K8S_11
  reason: "no CPU limit on purpose: a throttled cold start is slower, and requests already reserve CPU"
  expires: 2027-05-19

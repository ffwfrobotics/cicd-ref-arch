apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: keda
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: demo
spec:
  target:
    service: demo
    port: 80
  rules:
  - hosts:
    - demo-feature-webhook-docs.c-local.k.ffwf.net
  scalingMetric:
    concurrency:
      targetValue: 50
  timeouts:
    readiness: 60s
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: demo
spec:
  scaleTargetRef:
    kind: Deployment
    name: demo
  minReplicaCount: 0
  maxReplicaCount: 3
  cooldownPeriod: 900
  triggers:
  - type: external-push
    metadata:
      scalerAddress: keda-add-ons-http-external-scaler.keda:9090
      interceptorRoute: demo

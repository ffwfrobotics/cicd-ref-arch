# What cicd-ref-arch needs to know about the dashboard (it is an enrolled app on its own platform).
apiVersion: cicd.ffwf.net/v1alpha1
kind: App
metadata: {name: dashboard}
spec:
  build: {context: ., dockerfile: Dockerfile}
  deploy: {path: deploy}
  service: {name: dashboard, port: 80}
  workload: {kind: Deployment, name: dashboard}
  test:
    run: python3 -m venv .venv && .venv/bin/pip install -q -r requirements.txt && .venv/bin/python -m unittest discover -s tests -v
  environments:
    dev:    {branch: main, host: "{app}-dev.{cluster}.{zone}"}
    branch: {host: "{app}-{branch}.{cluster}.{zone}", exclude: ["renovate/*"]}
    prod:   {host: "{app}.{cluster}.{zone}"}
  scaleToZero:
    enabled: true
    idleSeconds: 900          # an open page holds a live connection, so it stays up while watched
    coldStartTimeout: 60s
    maxReplicas: 1            # one replica: its short-lived cache is per pod
    targetConcurrency: 100
  egress:
  - {cidr: 100.64.0.2/32, ports: [443]}   # the forge (forge.goblincorps.com resolves to its tailnet address in-cluster)

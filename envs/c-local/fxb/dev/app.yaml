apiVersion: v1
kind: Service
metadata:
  name: fxb
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app: fxb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fxb
spec:
  selector:
    matchLabels:
      app: fxb
  template:
    metadata:
      labels:
        app: fxb
    spec:
      automountServiceAccountToken: false
      containers:
      - image: app-image
        name: fxb
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          failureThreshold: 3
          periodSeconds: 1
          tcpSocket:
            port: http
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      enableServiceLinks: false
      securityContext:
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault

apiVersion: v1
kind: Service
metadata:
  name: dashboard
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app: dashboard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
spec:
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: FORGE_URL
          value: https://forge.goblincorps.com
        - name: STATE_REPO
          value: ffwf/cicd-ref-arch
        - name: CLUSTER
          value: c-local
        image: app-image
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        name: dashboard
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 1
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 20m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /var/run/secrets/dashboard-oauth
          name: oauth
          readOnly: true
        - mountPath: /var/run/secrets/dashboard-platform
          name: platform
          readOnly: true
      enableServiceLinks: false
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir:
          medium: Memory
          sizeLimit: 16Mi
        name: tmp
      - name: oauth
        secret:
          defaultMode: 288
          optional: true
          secretName: dashboard-oauth
      - name: platform
        secret:
          defaultMode: 288
          optional: true
          secretName: dashboard-platform

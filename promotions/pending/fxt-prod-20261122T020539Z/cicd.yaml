apiVersion: cicd.ffwf.net/v1alpha1
kind: App
metadata:
  name: fxt
spec:
  build:
    context: .
    dockerfile: Dockerfile
  deploy:
    path: deploy
  service:
    name: fxt
    port: 80
  workload:
    kind: Deployment
    name: fxt
  environments:
    dev:
      branch: main
      host: '{app}-dev.{cluster}.{zone}'
    branch:
      host: '{app}-{branch}.{cluster}.{zone}'
      exclude:
      - promote/*
      - renovate/*
    prod:
      host: '{app}.{cluster}.{zone}'
      extraHosts: []
      cluster: c-nested
  scaleToZero:
    enabled: true
    idleSeconds: 900
    coldStartTimeout: 60s
    maxReplicas: 3
    targetConcurrency: 50
  overlays:
    allow:
    - resources

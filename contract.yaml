# The app contract: one table for the published document (docs/contract.md, generated by
# `tools/intake.py doc`), the intake step that checks each push (tools/intake.py check), and
# the hints developers see on their commits and in the dashboard.
#
# A rule is what an app should do. A check is what intake can tell from the repo without
# running anything. Check states:
#   ok       the rule holds
#   assumed  missing, and intake filled in a default for this run (shown, not committed)
#   warn     the rule doesn't hold; the pipeline goes on, the hint says what to change
#   missing  nothing to run: the pipeline stops after intake (no build, no deploy)
rules:
- n: 1
  rule: "**`cicd.yaml`** at the app's root: name, test command, environments, scale-to-zero settings (see `templates/app/cicd.yaml`)."
  why: The pipeline reads everything app-specific from here.
  checks:
  - id: cicd-yaml
    what: cicd.yaml exists and names the enrolled app
    hint: "No cicd.yaml: defaults used. Commit the generated one (in the run log) and adjust it"
    fill: true
  - id: tests
    what: "spec.test.run is set"
    hint: "No test command: set spec.test.run in cicd.yaml"
- n: 2
  rule: "**`deploy/` is a kustomize base** with no namespace, no hostnames, no cluster names."
  why: One base renders into every environment on every cluster.
  checks:
  - id: deploy-base
    what: the deploy path holds a kustomization.yaml
    hint: "No deploy base: one Deployment and Service generated. Commit them (in the run log) to change them"
    fill: true
  - id: no-namespace
    what: no metadata.namespace in the base
    hint: "Remove metadata.namespace: each environment sets its own"
- n: 3
  rule: "**The container image is the literal name `app-image`.**"
  why: "The environment overlay replaces it with `<registry>/<app>@sha256:...`. Deploys are by digest, never by tag."
  checks:
  - id: app-image
    what: a container's image is `app-image`
    hint: "Set the app container's image to app-image: the pipeline swaps in what it built"
- n: 4
  rule: "**No `replicas`** on the scaled workload."
  why: KEDA owns the count (0 when idle); a fixed value would fight it on every Flux apply.
  checks:
  - id: no-replicas
    what: the workload sets no spec.replicas
    hint: "Remove spec.replicas: KEDA sets the count"
- n: 5
  rule: "**Pods pass Pod Security `restricted`**: non-root, no privilege escalation, all capabilities dropped, RuntimeDefault seccomp."
  why: Each environment namespace enforces it.
  checks:
  - id: restricted
    what: "runAsNonRoot, seccompProfile RuntimeDefault, allowPrivilegeEscalation false, capabilities drop ALL"
    hint: "The pod will be refused: add the securityContext fields named (see templates/app/deploy/deployment.yaml)"
- n: 6
  rule: "**A readiness probe on a cheap endpoint**, `periodSeconds: 1`."
  why: A cold start lasts until the first passing probe.
  checks:
  - id: readiness
    what: each container has a readinessProbe
    hint: "Add a readinessProbe: without one, requests reach the pod before it listens"
- n: 7
  rule: "**The Service named in `cicd.yaml`** fronts the app on the port named there."
  why: The InterceptorRoute targets it.
  checks:
  - id: service
    what: "a Service named spec.service.name with port spec.service.port"
    hint: "The gateway can't reach the app: add the Service, or fix spec.service in cicd.yaml"
- n: 8
  rule: "**Resource requests set and small.**"
  why: Idle apps are at zero anyway; requests are what a running app reserves.
  checks:
  - id: requests
    what: each container sets resources.requests
    hint: "Set resources.requests (e.g. cpu 10m, memory 32Mi)"
- n: 9
  rule: "**The Dockerfile pins its base image by digest.**"
  why: Builds are reproducible, and the base is the first thing the security slot swaps (docs/security.md).
  checks:
  - id: dockerfile
    what: "the Dockerfile named in spec.build exists"
    hint: "Nothing to run: add a Dockerfile (spec.build.dockerfile in cicd.yaml says where)"
    stops: true
  - id: base-pinned
    what: "each FROM names its image @sha256:..."
    hint: "Pin the base image by digest: FROM image:tag@sha256:..."
- n: 10
  rule: "**Egress is denied unless `cicd.yaml` lists it** (`spec.egress: [{cidr, ports}]`)."
  why: Each environment gets a default-deny NetworkPolicy. DNS is always allowed.
  checks: []
secrets: >-
  Secrets: not in v1. Apps that need one name it in their base, and the value goes in out of
  band, the same way the private fleet seeds its Secrets. SOPS with age (decided in the
  base-stack doc) comes later.

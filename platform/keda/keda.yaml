apiVersion: v1
kind: Namespace
metadata:
  name: keda
  labels: {pod-security.kubernetes.io/enforce: baseline}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: keda, namespace: keda}
spec:
  interval: 1h
  chart:
    spec:
      chart: keda
      version: 2.21.1
      sourceRef: {kind: HelmRepository, name: kedacore, namespace: flux-system}
  install: {crds: CreateReplace}
  upgrade: {crds: CreateReplace}
  values:
    resources:
      operator: {requests: {cpu: 20m, memory: 64Mi}, limits: {memory: 512Mi}}
      metricServer: {requests: {cpu: 20m, memory: 64Mi}, limits: {memory: 512Mi}}
      webhooks: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 256Mi}}

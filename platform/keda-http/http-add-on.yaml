# The HTTP add-on: the interceptor proxies every app request, counts them for scaling, and holds
# requests for an app at zero replicas until a pod is ready (InterceptorRoute timeouts.readiness).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: http-add-on, namespace: keda}
spec:
  interval: 1h
  chart:
    spec:
      chart: keda-add-ons-http
      version: 0.16.0
      sourceRef: {kind: HelmRepository, name: kedacore, namespace: flux-system}
  install: {crds: CreateReplace}
  upgrade: {crds: CreateReplace}
  values:
    interceptor:
      replicas: {min: 1, max: 3}   # one node; raise min on a real cluster (it is on the request path)

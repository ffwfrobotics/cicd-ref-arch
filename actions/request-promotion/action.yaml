name: request-promotion
description: >
  Open a promotion pull request on the state repo, pinned to what the source environment runs now,
  re-scanned under the prod policy, with the suppressions it carries. Used by the platform's
  request-promotion workflow and by the platform pipeline (dispatched for a user with write
  on the app repo; that user is recorded as the requester).
inputs:
  app: {required: true}
  from: {default: dev}
  not-before: {default: ""}
  reason: {default: ""}
  requested-by: {required: true}
  cluster: {required: true}
  token: {description: token that can push branches to and open PRs on the state repo, required: true}
  user: {description: the token's user, required: true}
  state-repo: {description: "owner/name (default: this repo)", default: ""}
outputs:
  url: {value: "${{ steps.req.outputs.url }}"}
runs:
  using: composite
  steps:
  - id: req
    shell: bash
    env:
      TOKEN: ${{ inputs.token }}
      REASON: ${{ inputs.reason }}
      WHO: ${{ inputs.requested-by }}
      NB: ${{ inputs.not-before }}
    run: |
      set -eu
      repo='${{ inputs.state-repo }}'; [ -n "$repo" ] || repo='${{ github.repository }}'
      server='${{ github.server_url }}'; api="$server/api/v1/repos/$repo"
      cicd=$(cd '${{ github.action_path }}/../..' && pwd)
      auth="AUTHORIZATION: basic $(printf '%s:%s' '${{ inputs.user }}' "$TOKEN" | base64 -w0)"
      state=$(mktemp -d); git -c http.extraHeader="$auth" clone -q --depth 5 "$server/$repo.git" "$state"; cd "$state"
      app='${{ inputs.app }}'; cluster='${{ inputs.cluster }}'; nb="$NB"; who="$WHO"
      dir=$(python3 "$cicd/tools/cicd.py" request-promotion --app "$app" --cluster "$cluster" \
        --from '${{ inputs.from }}' ${nb:+--not-before "$nb"} --requested-by "$who" --reason "$REASON")
      id=$(basename "$dir")
      # the compliance repo: IT Security's findings and advisories are part of the prod gate
      read -r crepo cbranch < <(python3 -c "import yaml,sys;c=yaml.safe_load(open(sys.argv[1])).get('compliance') or {};print(c.get('repo','-'),c.get('branch','main'))" "clusters/$cluster/cicd-cluster.yaml")
      git -c http.extraHeader="$auth" clone -q --depth 1 -b "$cbranch" "$server/$crepo.git" .compliance 2>/dev/null || echo "no compliance repo $crepo"
      # re-scan the pinned image with today's vulnerability data and gate it as prod will
      sec_rc=0; sec=$(python3 "$cicd/tools/cicd.py" check-security "$dir" --cluster "$cluster") || sec_rc=$?
      echo "$sec"
      sec_md=$(python3 "$cicd/tools/security.py" summary "$dir/security-record.json" 2>/dev/null || echo "no security record")
      assess_md=$(python3 - "$dir/evidence/assessment-summary.json" <<'PY' 2>/dev/null || echo "no self-assessment (no compliance repo)"
      import json, sys
      s = json.load(open(sys.argv[1]))
      c, cov = s["counts"], s["coverage"]
      print(f"**{c['satisfied']} of {len(s['objectives'])} objectives satisfied** (" + ", ".join(f"{v} {k}" for k, v in sorted(cov.items())) + ")\n")
      bad = [o for o in s["objectives"] if o["state"] != "satisfied"]
      if bad:
          print("| objective | coverage | why |\n|---|---|---|")
          for o in bad:
              why = "; ".join(e["found"] for e in o["evidence"] if not e["holds"]) or o["reason"]
              print(f"| `{o['id']}` | {o['coverage']} | {why} |")
      PY
      )
      # a deploy-prod/ overlay: what prod runs differs from what the source environment runs, and the PR shows how
      env_diff=$(diff -u --label "${{ inputs.from }}" --label prod "envs/$cluster/$app/${{ inputs.from }}/app.yaml" "$dir/app.yaml" 2>/dev/null | head -150 || true)
      prod="envs/$cluster/$app/prod/suppressions"
      sup_diff=$(diff -ruN "$prod" "$(realpath --relative-to=. "$dir")/suppressions" 2>/dev/null | grep -v '^diff -ruN' || true)
      git config user.name cicd-bot; git config user.email cicd-bot@noreply.invalid
      git checkout -q -b "promote/$id"
      git add "$dir"
      git commit -q -m "promote $app ${{ inputs.from }} -> prod ($id)" -m "requested by $who: $REASON"
      git -c http.extraHeader="$auth" push -q origin "promote/$id"
      body=$(jq -n --arg id "$id" --arg p "$(cat "$dir/promotion.yaml")" --arg sec "$sec_md" --arg diff "${sup_diff:-no changes}" --arg who "$who" --arg assess "$assess_md" --arg envdiff "${env_diff:-}" \
        '"Promotion request `\($id)`, requested by **\($who)**.\n\n```yaml\n\($p)\n```\n\nMerging this queues it: the `environments` workflow applies whatever is merged, at or after `notBefore`. Who approved and merged it is recorded with it in prod; a second person (not \($who)) is the expected path.\n\n`app.yaml` in this PR is exactly what will run in prod.\(if $envdiff == "" then "" else "\n\n## Prod differs from ${{ inputs.from }} (deploy-prod/)\n\n```diff\n\($envdiff)\n```" end)\n\n## Security (re-scanned now, prod policy)\n\n\($sec)\n\nThe commit status `cicd/promotion` carries this result. The `environments` workflow scans the image again when it applies the promotion and records the result in prod.\n\n## Self-assessment (OSCAL, the owner'"'"'s evidence)\n\n\($assess)\n\n## Suppressions this carries to prod (diff against prod)\n\n```diff\n\($diff)\n```"')
      title="Promote $app to prod ($id)"; [ "$sec_rc" = 0 ] || title="[security: fail] $title"
      url=$(jq -n --arg head "promote/$id" --arg title "$title" --argjson body "$body" \
        '{head: $head, base: "master", title: $title, body: $body}' \
        | curl -fsS -X POST -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' -d @- "$api/pulls" | jq -r .html_url)
      # the re-scan as a commit status on the PR: shown everywhere, and a forge that wants it enforced
      # before the merge makes cicd/promotion a required check on master (docs/security.md)
      st=success; [ "$sec_rc" = 0 ] || st=failure
      jq -n --arg s "$st" --arg u "$url" --arg d "$(printf '%s' "$sec" | tail -n1 | cut -c1-120)" \
        '{state: $s, context: "cicd/promotion", description: $d, target_url: $u}' \
        | curl -fsS -o /dev/null -X POST -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' -d @- \
          "$api/statuses/$(git rev-parse HEAD)" || echo "::warning::could not set the cicd/promotion status"
      echo "opened $url"; echo "url=$url" >> "$GITHUB_OUTPUT"

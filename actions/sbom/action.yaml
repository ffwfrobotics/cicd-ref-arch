name: sbom
description: >
  SECURITY SLOT (docs/security.md): an SPDX SBOM of the built image, from its OCI tarball. Today it
  is kept as a job artifact. Later: attach it to the image as an attestation (cosign attest / OCI
  referrer) so promotion can check it.
inputs:
  image-tar: {required: true}
  out: {default: security}
runs:
  using: composite
  steps:
  - shell: bash
    run: |
      set -eu; mkdir -p '${{ inputs.out }}'
      syft scan 'oci-archive:${{ inputs.image-tar }}' -o 'spdx-json=${{ inputs.out }}/sbom.spdx.json' -q
      echo "SBOM: $(jq '.packages | length' '${{ inputs.out }}/sbom.spdx.json') packages"

name: security
description: >
  Scan the app's tree (gitleaks, opengrep, checkov) and its built image (syft SBOM, then grype with
  the app's VEX), then gate the findings by policy for this environment (tools/security.py), with
  IT Security's findings and announced vulnerabilities from the owner's compliance repo as tests
  (tools/external.py), and make the commit's OSCAL self-assessment (tools/oscal.py). In dev and
  branch environments findings are reported and the job goes on, except a secret in the tree,
  which stops the deploy. Writes everything to build/security/: native scanner output, SBOMs, the
  normalised findings, the gate record, ci-result/v1 records and the assessment.
inputs:
  app: {description: path to the app's directory (holds cicd.yaml), required: true}
  env: {description: "dev, branch or prod: picks the policy's mode", required: true}
  cluster: {description: "the cluster (its cicd-cluster.yaml names the compliance repo)", default: c-local}
  image-tar: {description: OCI tarball of the built image, default: build/image.oci.tar}
  image: {description: the image reference to record (pull name with digest), required: true}
  manifests: {description: the built deploy base, default: build/app.yaml}
  test-result: {description: "the test job's ci-result record, if downloaded", default: build/ci-result-test/test.json}
  out: {default: build/security}
  token: {description: "a token that can read the compliance repo (it may be private)", default: ""}
  user: {description: "the token's user", default: ""}
  commit: {description: "the app commit (default: the commit this run is for)", default: ""}
  # a build-only app's target (actions/build's target-* inputs): no cicd.yaml and no deploy base
  target-image: {description: "build-only: the image name (<app>-<target>): its ledger and assessment name", default: ""}
  target-context: {default: "."}
  target-dockerfile: {default: "Dockerfile"}
outputs:
  status: {description: "pass, warn or fail", value: "${{ steps.gate.outputs.status }}"}
runs:
  using: composite
  steps:
  - id: gate
    shell: bash
    env:
      CTOKEN: ${{ inputs.token }}
      CUSER: ${{ inputs.user }}
      COMMIT: ${{ inputs.commit }}
      TARGET_IMAGE: ${{ inputs.target-image }}
      TARGET_CONTEXT: ${{ inputs.target-context }}
      TARGET_DOCKERFILE: ${{ inputs.target-dockerfile }}
    run: |
      set -u
      cicd=$(cd '${{ github.action_path }}/../..' && pwd)
      app='${{ inputs.app }}'; out='${{ inputs.out }}'; mkdir -p "$out"
      # the Dockerfile is named from the IaC root (as actions/build reads it); the build context may lie outside it
      # (a monorepo app built from ../../svc-a, docs/enrollment.md): then the context is scanned too
      if [ -n "$TARGET_IMAGE" ]; then
        dockerfile=$TARGET_DOCKERFILE; context=$TARGET_CONTEXT; name=$TARGET_IMAGE
      else
        read -r dockerfile context < <(python3 -c "import yaml,sys;b=yaml.safe_load(open(sys.argv[1]))['spec'].get('build',{});print(b.get('dockerfile','Dockerfile'), b.get('context','.'))" "$app/cicd.yaml")
        name=$(python3 -c "import yaml,sys;print(yaml.safe_load(open(sys.argv[1]))['metadata']['name'])" "$app/cicd.yaml")
      fi

      # the owner's compliance repo (may be private: read with the bot token): IT Security's findings, advisories, OSCAL content
      comp="${RUNNER_TEMP:-/tmp}/compliance"; rm -rf "$comp"
      read -r crepo cbranch < <(python3 -c "import yaml,sys;c=yaml.safe_load(open(sys.argv[1])).get('compliance') or {};print(c.get('repo','-'),c.get('branch','main'))" "$cicd/clusters/${{ inputs.cluster }}/cicd-cluster.yaml")
      cauth=(); [ -n "$CTOKEN" ] && cauth=(-c "http.extraHeader=AUTHORIZATION: basic $(printf '%s:%s' "$CUSER" "$CTOKEN" | base64 -w0)")
      if [ "$crepo" != "-" ] && git "${cauth[@]}" clone -q --depth 1 -b "$cbranch" "${{ github.server_url }}/$crepo.git" "$comp" 2>/dev/null; then
        echo "compliance repo $crepo at $(git -C "$comp" rev-parse --short HEAD)"
        ext=(--ledger "$comp/ledger/$name.yaml" --advisories "$comp/advisories" --sbom "$out/sbom.cdx.json"
             --skip-endpoints "checked after deploy (cicd-ref-arch assess workflow)")
      else
        echo "::notice::no compliance repo ($crepo): no IT Security findings and no self-assessment for this build"
        comp=""; ext=()
      fi

      python3 "$cicd/tools/security.py" scan-source "$app" --dockerfile "$app/$dockerfile" --manifests '${{ inputs.manifests }}' --out "$out" 2>"$out/scan.log" || true
      ctx=$(realpath -m "$app/$context"); case "$ctx/" in "$(realpath "$app")/"*) ctx="" ;; esac
      if [ -n "$ctx" ] && [ -d "$ctx" ]; then
        python3 "$cicd/tools/security.py" scan-source "$ctx" --dockerfile "$app/$dockerfile" --manifests '${{ inputs.manifests }}' --out "$out/context" 2>>"$out/scan.log" || true
        python3 - "$out/findings-source.json" "$out/context/findings-source.json" "$context" <<'PY' || true
      import json, sys
      main, extra, rel = sys.argv[1], sys.argv[2], sys.argv[3].rstrip("/")
      a, b = json.load(open(main)), json.load(open(extra))
      known = {(f["rule"], f["location"]) for f in a["findings"]}
      for f in b["findings"]:
          if f.get("category") != "config":          # the Dockerfile and manifests were scanned from the IaC root already
              f["location"] = f"{rel}/{f['location']}"
              if (f["rule"], f["location"]) not in known:
                  a["findings"].append(f)
      a["scanned"] = [".", rel]
      json.dump(a, open(main, "w"), indent=2)
      print(f"build context {rel}: {len(b['findings'])} findings merged")
      PY
      fi
      python3 "$cicd/tools/security.py" scan-image --oci-archive '${{ inputs.image-tar }}' --digest '${{ inputs.image }}' --name "$name" \
        --vex "$app/security/vex.openvex.json" --out "$out" 2>>"$out/scan.log" || true
      rc=0
      python3 "$cicd/tools/security.py" gate --env '${{ inputs.env }}' --policy "$cicd/security/policy.yaml" \
        --app-policy "$app/security/policy.yaml" --findings "$out/findings-source.json" --findings "$out/findings-image.json" \
        --app-name "$name" --image '${{ inputs.image }}' --out "$out/security.json" "${ext[@]}" \
        --ci-result "$out/ci-result-security.json" || rc=$?
      status=$(jq -r .gate.status "$out/security.json")
      echo "status=$status" >> "$GITHUB_OUTPUT"
      { echo "### Security: $status"; python3 "$cicd/tools/security.py" summary "$out/security.json"; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      # the commit's self-assessment (OSCAL assessment results), from this build's records
      if [ -n "$comp" ]; then
        if [ -f '${{ inputs.test-result }}' ]; then cp '${{ inputs.test-result }}' "$out/ci-result-test.json"; fi
        if [ -f "$app/oscal/component.yaml" ]; then cp "$app/oscal/component.yaml" "$out/app-component.yaml"; fi
        if [ -f '${{ inputs.manifests }}' ]; then cp '${{ inputs.manifests }}' "$out/app.yaml"; fi   # none for a build-only target
        { echo '### Self-assessment'; echo '```'
          CICD_COMPLIANCE_DIR="$comp" python3 "$cicd/tools/cicd.py" --root "$cicd" assess-evidence --app "$name" \
            --env '${{ inputs.env }}' --evidence "$out" --commit "${COMMIT:-$GITHUB_SHA}" --image '${{ inputs.image }}' 2>&1 \
            || echo "self-assessment failed"
          echo '```'; } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
        rm -f "$out/app.yaml"
      fi
      exit "$rc"

name: security
description: >
  Scan the app's tree (gitleaks, opengrep, checkov) and its built image (syft SBOM, then grype with
  the app's VEX), then gate the findings by policy for this environment (tools/security.py). In dev
  and branch environments findings are reported and the job goes on, except a secret in the tree,
  which stops the deploy. Writes everything to build/security/: native scanner output, SBOMs, the
  normalised findings, the gate record and a ci-result/v1 record.
inputs:
  app: {description: path to the app's directory (holds cicd.yaml), required: true}
  env: {description: "dev, branch or prod: picks the policy's mode", required: true}
  image-tar: {description: OCI tarball of the built image, default: build/image.oci.tar}
  image: {description: the image reference to record (pull name with digest), required: true}
  manifests: {description: the built deploy base, default: build/app.yaml}
  out: {default: build/security}
outputs:
  status: {description: "pass, warn or fail", value: "${{ steps.gate.outputs.status }}"}
runs:
  using: composite
  steps:
  - id: gate
    shell: bash
    run: |
      set -u
      cicd=$(cd '${{ github.action_path }}/../..' && pwd)
      app='${{ inputs.app }}'; out='${{ inputs.out }}'; mkdir -p "$out"
      dockerfile=$(python3 -c "import yaml,sys;b=yaml.safe_load(open(sys.argv[1]))['spec'].get('build',{});print(b.get('context','.')+'/'+b.get('dockerfile','Dockerfile'))" "$app/cicd.yaml")
      name=$(python3 -c "import yaml,sys;print(yaml.safe_load(open(sys.argv[1]))['metadata']['name'])" "$app/cicd.yaml")
      python3 "$cicd/tools/security.py" scan-source "$app" --dockerfile "$app/$dockerfile" --manifests '${{ inputs.manifests }}' --out "$out" 2>"$out/scan-source.log" || true
      python3 "$cicd/tools/security.py" scan-image --oci-archive '${{ inputs.image-tar }}' --digest '${{ inputs.image }}' --name "$name" \
        --vex "$app/security/vex.openvex.json" --out "$out" 2>"$out/scan-image.log" || true
      rc=0
      python3 "$cicd/tools/security.py" gate --env '${{ inputs.env }}' --policy "$cicd/security/policy.yaml" \
        --app-policy "$app/security/policy.yaml" --findings "$out/findings-source.json" --findings "$out/findings-image.json" \
        --app-name "$name" --image '${{ inputs.image }}' --out "$out/security.json" \
        --ci-result "$out/ci-result-security.json" || rc=$?
      status=$(jq -r .gate.status "$out/security.json")
      echo "status=$status" >> "$GITHUB_OUTPUT"
      { echo "### Security: $status"; python3 "$cicd/tools/security.py" summary "$out/security.json"; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
      exit "$rc"

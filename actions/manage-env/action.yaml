name: manage-env
description: >
  Self-service on an app's environments: pause or resume a branch (a paused branch doesn't go
  through CI/CD and loses its environment), or remove a branch environment. Run by an enrolled
  app's own pipeline when a user with write on the app repo dispatches it; the commit names them.
inputs:
  action: {description: "pause, resume or remove-env", required: true}
  app: {description: path to the app's directory (holds cicd.yaml), required: true}
  branch: {required: true}
  by: {description: who asked, required: true}
  cluster: {required: true}
  token: {required: true}
  user: {required: true}
  state-repo: {default: ""}
runs:
  using: composite
  steps:
  - shell: bash
    env:
      TOKEN: ${{ inputs.token }}
      BRANCH: ${{ inputs.branch }}
      BY: ${{ inputs.by }}
      ACTION: ${{ inputs.action }}
    run: |
      set -eu
      repo='${{ inputs.state-repo }}'; [ -n "$repo" ] || repo='${{ github.repository }}'
      server='${{ github.server_url }}'
      cicd=$(cd '${{ github.action_path }}/../..' && pwd)
      cfg="$GITHUB_WORKSPACE/${{ inputs.app }}/cicd.yaml"
      name=$(python3 -c "import yaml,sys;print(yaml.safe_load(open(sys.argv[1]))['metadata']['name'])" "$cfg")
      auth="AUTHORIZATION: basic $(printf '%s:%s' '${{ inputs.user }}' "$TOKEN" | base64 -w0)"
      state=$(mktemp -d); git -c http.extraHeader="$auth" clone -q --depth 20 "$server/$repo.git" "$state"; cd "$state"
      git config user.name cicd-bot; git config user.email cicd-bot@noreply.invalid
      for attempt in 1 2 3 4 5; do
        git -c http.extraHeader="$auth" fetch -q origin master && git reset -q --hard origin/master
        msg=$(python3 "$cicd/tools/cicd.py" manage "$ACTION" --app "$name" --app-config "$cfg" \
          --branch "$BRANCH" --cluster '${{ inputs.cluster }}' --by "$BY")
        git add -A envs
        if git diff --cached --quiet; then echo "nothing to change: $msg"; break; fi
        git commit -q -m "$msg" -m "from ${{ github.repository }}, run ${{ github.run_number }}"
        if git -c http.extraHeader="$auth" push -q origin HEAD:master; then echo "$msg"; break; fi
        [ "$attempt" = 5 ] && exit 1
        sleep $((attempt * 3))
      done

# Ask for a promotion from the Forgejo UI (Actions -> request-promotion -> Run workflow).
# Opens a pull request that pins the exact manifests and image digest running in the source
# environment. Someone other than the requester approves and merges it; the environments
# workflow applies it once notBefore has passed.
name: request-promotion
on:
  workflow_dispatch:
    inputs:
      app: {description: "app (directory under examples/)", required: true, default: hello}
      from: {description: "source environment", required: true, default: dev}
      not_before: {description: "earliest UTC time, e.g. 2026-11-20T15:00:00Z (blank = as soon as approved)", required: false}
      reason: {description: "why", required: false}

jobs:
  request:
    runs-on: cicd
    steps:
    - uses: actions/checkout@v4
      with: {persist-credentials: false}
    - uses: ./actions/setup
    - uses: ./actions/request-promotion
      with:
        app: ${{ inputs.app }}
        from: ${{ inputs.from }}
        not-before: ${{ inputs.not_before }}
        reason: ${{ inputs.reason }}
        requested-by: ${{ github.actor }}
        cluster: ${{ vars.CICD_CLUSTER || 'c-local' }}
        token: ${{ secrets.CICD_BOT_TOKEN }}
        user: ${{ vars.CICD_BOT_USER }}

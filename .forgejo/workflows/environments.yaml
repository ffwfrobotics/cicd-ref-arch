# Housekeeping for the state this repo holds:
#  - apply promotions that are approved and due (every 5 minutes, and when one is merged)
#  - remove branch environments whose branch was deleted, here or in an enrolled app's repo
#    (on delete, every 5 minutes, and when an app's pipeline dispatches it after a branch delete)
#  - run the platform pipeline for enrolled branch heads it hasn't seen: the safety net under the
#    forge webhook that normally dispatches it (pipeline.yaml)
name: environments
on:
  schedule: [{cron: "*/5 * * * *"}]
  push:
    branches: [master]
    paths: [promotions/pending/**]
  delete:
  workflow_dispatch:

env:
  CLUSTER: ${{ vars.CICD_CLUSTER || 'c-local' }}

jobs:
  reconcile:
    runs-on: ffwf-k8s
    steps:
    # no persisted job token: pushes to master must come from the bot, which is on its push whitelist
    - uses: actions/checkout@v4
      with: {fetch-depth: 0, persist-credentials: false}
    - uses: ./actions/setup
    - name: promote due, collect gone branches
      env:
        FORGEJO_TOKEN: ${{ secrets.CICD_BOT_TOKEN }}
        FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        BOT: ${{ vars.CICD_BOT_USER }}
      run: |
        set -eu
        test -n "$FORGEJO_TOKEN" || { echo "secret CICD_BOT_TOKEN is not set" >&2; exit 1; }
        auth="AUTHORIZATION: basic $(printf '%s:%s' "$BOT" "$FORGEJO_TOKEN" | base64 -w0)"
        git config user.name cicd-bot; git config user.email cicd-bot@noreply.invalid
        for attempt in 1 2 3 4 5; do
          git -c http.extraHeader="$auth" fetch -q origin master && git reset -q --hard origin/master
          # the compliance repo: IT Security's findings and advisories are part of the prod gate
          read -r crepo cbranch < <(python3 -c "import yaml;c=yaml.safe_load(open('clusters/$CLUSTER/cicd-cluster.yaml')).get('compliance') or {};print(c.get('repo','-'),c.get('branch','main'))")
          rm -rf .compliance; git -c http.extraHeader="$auth" clone -q --depth 1 -b "$cbranch" "${{ github.server_url }}/$crepo.git" .compliance || echo "::warning::no compliance repo $crepo"
          rc=0; python3 tools/cicd.py apply-due --cluster "$CLUSTER" > promote.log || rc=$?; cat promote.log
          python3 tools/cicd.py gc --cluster "$CLUSTER" --repo '${{ github.repository }}' --server '${{ github.server_url }}' | tee gc.log
          git add -A envs promotions
          if git diff --cached --quiet; then echo "nothing to do"; break; fi
          git commit -q -m "environments: $(grep -c ': applied' promote.log || true) promoted, $(grep -c '^removing' gc.log || true) removed" \
            -m "$(grep -E ': applied|^removing' promote.log gc.log || true)"
          git -c http.extraHeader="$auth" push -q origin HEAD:master && break
          [ "$attempt" = 5 ] && exit 1
          sleep $((attempt * 3))
        done
        # a due promotion that failed its checks turns the run red (after committing anything else)
        [ "$rc" = 0 ] || { echo "::error::a due promotion was refused: see promote.log above"; exit "$rc"; }
    - name: dispatch missed pushes
      if: always()
      env:
        FORGEJO_TOKEN: ${{ secrets.CICD_BOT_TOKEN }}
      run: python3 tools/cicd.py dispatch-missing --cluster "$CLUSTER" --repo '${{ github.repository }}' --server '${{ github.server_url }}'

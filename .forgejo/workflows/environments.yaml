# Housekeeping for the state this repo holds:
#  - apply promotions that are approved and due (every 5 minutes, and when one is merged)
#  - remove branch environments whose branch was deleted (on delete, and every 5 minutes)
name: environments
on:
  schedule: [{cron: "*/5 * * * *"}]
  push:
    branches: [master]
    paths: [promotions/pending/**]
  delete:
  workflow_dispatch:

env:
  CLUSTER: ${{ vars.CICD_CLUSTER || 'c-local' }}

jobs:
  reconcile:
    runs-on: ffwf-k8s
    steps:
    - uses: actions/checkout@v4
      with: {fetch-depth: 0}
    - uses: ./actions/setup
    - name: promote due, collect gone branches
      env:
        FORGEJO_TOKEN: ${{ secrets.CICD_BOT_TOKEN }}
        FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        BOT: ${{ vars.CICD_BOT_USER }}
      run: |
        set -eu
        test -n "$FORGEJO_TOKEN" || { echo "secret CICD_BOT_TOKEN is not set" >&2; exit 1; }
        auth="AUTHORIZATION: basic $(printf '%s:%s' "$BOT" "$FORGEJO_TOKEN" | base64 -w0)"
        git config user.name cicd-bot; git config user.email cicd-bot@noreply.invalid
        for attempt in 1 2 3 4 5; do
          git -c http.extraHeader="$auth" fetch -q origin master && git reset -q --hard origin/master
          python3 tools/cicd.py apply-due --cluster "$CLUSTER" | tee promote.log
          python3 tools/cicd.py gc --cluster "$CLUSTER" --repo '${{ github.repository }}' | tee gc.log
          git add -A envs promotions
          if git diff --cached --quiet; then echo "nothing to do"; break; fi
          git commit -q -m "environments: $(grep -c ': applied' promote.log || true) promoted, $(grep -c '^removing' gc.log || true) removed" \
            -m "$(grep -E ': applied|^removing' promote.log gc.log || true)"
          git -c http.extraHeader="$auth" push -q origin HEAD:master && break
          [ "$attempt" = 5 ] && exit 1
          sleep $((attempt * 3))
        done

# The cicd-ref-arch pipeline for every enrolled app, run here, in the platform repo (docs/enroll.md).
# App repos hold no workflow and no token: a push to one is noticed by
#  - the forge's webhook on the app repo, which cicd-dashboard turns into a dispatch of this workflow;
#  - and, as a safety net, the environments workflow (every 5 minutes): `cicd.py dispatch-missing`
#    dispatches any enrolled branch head that has no run here yet.
# Self-service (pause, resume, remove-env, request-promotion) comes from the dashboard, which checks
# that the user has write on the app repo and names them in `actor`.
#
# Every run is titled "pipeline"; its dispatch inputs (app, branch, sha, action, actor) say what it
# is for, and the dashboard reads them from the runs API.
#
# Only this repo's writers (the platform admins and its bot) can dispatch it. The app is named by
# its enrollment (tenants/<app>.yaml), which says which repo and path to check out: a dispatch can't
# point the pipeline at a repo nobody enrolled.
name: pipeline
on:
  workflow_dispatch:
    inputs:
      app: {description: "the enrolled app (tenants/<app>.yaml)", required: true}
      branch: {description: "the app repo's branch", required: true}
      sha: {description: "the commit (default: the branch's head)", default: ""}
      action: {description: "deploy | pause | resume | remove-env | request-promotion | bump", default: deploy}
      actor: {description: "who asked (self-service), or who pushed", default: ""}
      not_before: {description: "request-promotion: earliest UTC time, e.g. 2026-11-20T15:00:00Z", default: ""}
      reason: {description: "request-promotion: why", default: ""}
      source: {description: "bump: the source repo (owner/name) that was pushed; branch and sha are its own", default: ""}

env:
  CLUSTER: ${{ vars.CICD_CLUSTER || 'c-local' }}
  STATE_REPO: ${{ github.repository }}

jobs:
  # which repo and commit, and does this push go through CI/CD? (excluded, paused, the tenant's limit)
  route:
    runs-on: ffwf-k8s
    outputs:
      env: ${{ steps.route.outputs.env || steps.app.outputs.env }}
      repo: ${{ steps.app.outputs.repo }}
      path: ${{ steps.app.outputs.path }}
      sha: ${{ steps.route.outputs.sha }}
      sources: ${{ steps.app.outputs.sources }}
      dev_branch: ${{ steps.intake.outputs.dev_branch }}
    steps:
    - uses: actions/checkout@v4
      with: {path: .cicd, persist-credentials: false}
    - uses: ./.cicd/actions/setup
    - id: app
      env: {APP_NAME: "${{ inputs.app }}", BRANCH: "${{ inputs.branch }}", SHA: "${{ inputs.sha }}", ACTION: "${{ inputs.action }}",
            SOURCE: "${{ inputs.source }}"}
      run: |
        set -eu
        [[ "$APP_NAME" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]] || { echo "::error::bad app name"; exit 1; }
        [[ -z "$SHA" || "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full commit id"; exit 1; }
        git check-ref-format --branch "$BRANCH" >/dev/null || { echo "::error::bad branch name"; exit 1; }
        case "$ACTION" in deploy|pause|resume|remove-env|request-promotion|bump) ;; *) echo "::error::unknown action $ACTION"; exit 1 ;; esac
        # the tenant record, checked and with its defaults (docs/enrollment.md): the IaC root, its mode and sources
        python3 .cicd/tools/cicd.py --root .cicd tenant "$APP_NAME" --github-output >> "$GITHUB_OUTPUT" || { echo "::error::$APP_NAME: bad or missing tenant record"; exit 1; }
        # a stack (docs/stacks.md): no app contract, no build; its own job stands a cluster up and checks it
        if grep -q '^kind=Stack$' "$GITHUB_OUTPUT" && [ "$ACTION" = deploy ]; then
          echo "env=stack" >> "$GITHUB_OUTPUT"; exit 0
        fi
        if [ "$ACTION" = bump ]; then
          [[ "$SOURCE" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::bump needs source=owner/name"; exit 1; }
          [ -n "$SHA" ] || { echo "::error::bump needs the pushed sha"; exit 1; }
          echo "env=bump" >> "$GITHUB_OUTPUT"; exit 0
        fi
        if [ "$ACTION" = request-promotion ] && grep -q '^status=pending$' "$GITHUB_OUTPUT"; then
          echo "::error::$APP_NAME is pending: an admin approves it before it can be promoted"; exit 1
        fi
    - if: inputs.action != 'bump' && steps.app.outputs.env != 'stack'
      uses: actions/checkout@v4
      with: {repository: "${{ steps.app.outputs.repo }}", ref: "${{ inputs.sha || inputs.branch }}", path: app, submodules: recursive,
             token: "${{ secrets.CICD_BOT_TOKEN }}", persist-credentials: false}
    # the contract (contract.yaml): fills in cicd.yaml and deploy/ when they're missing, and says
    # what to fix as commit statuses on the app repo. Never fails; nothing to run stops the run here.
    - id: intake
      if: inputs.action != 'bump' && steps.app.outputs.env != 'stack'
      env: {APP_NAME: "${{ inputs.app }}", REPO: "${{ steps.app.outputs.repo }}", APP: "app/${{ steps.app.outputs.path }}",
            ACTION: "${{ inputs.action }}", TOKEN: "${{ secrets.CICD_BOT_TOKEN }}", SERVER: "${{ github.server_url }}"}
      run: |
        dev=$(curl -fsS -H "Authorization: token $TOKEN" "$SERVER/api/v1/repos/$REPO" | jq -r '.default_branch // "main"')
        echo "dev_branch=$dev" >> "$GITHUB_OUTPUT"
        python3 .cicd/tools/intake.py check "$APP" --app "$APP_NAME" --dev-branch "$dev" --fill --out intake.json --github-output
        if [ "$ACTION" = deploy ]; then
          FORGEJO_TOKEN="$TOKEN" python3 .cicd/tools/intake.py statuses intake.json --repo "$REPO" --sha "$(git -C app rev-parse HEAD)" \
            --server "$SERVER" --target-url "$SERVER/${{ github.repository }}/actions/runs/${{ github.run_number }}"
        fi
    - id: route
      if: inputs.action != 'bump' && steps.app.outputs.env != 'stack'
      env: {BRANCH: "${{ inputs.branch }}", APP: "app/${{ steps.app.outputs.path }}", ACTION: "${{ inputs.action }}", ACTOR: "${{ inputs.actor }}",
            RUNNABLE: "${{ steps.intake.outputs.runnable }}"}
      run: |
        echo "sha=$(git -C app rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "${{ steps.app.outputs.repo }} $BRANCH $(git -C app rev-parse --short HEAD): $ACTION${ACTOR:+, by $ACTOR}"
        [ "$ACTION" = deploy ] || { echo "env=manage" >> "$GITHUB_OUTPUT"; exit 0; }
        [ "$RUNNABLE" = true ] || { echo "env=skip-intake" >> "$GITHUB_OUTPUT"; echo "::notice::nothing to run: see the contract statuses"; exit 0; }
        env=$(python3 .cicd/tools/cicd.py --root .cicd which-env "$APP/cicd.yaml" --branch "$BRANCH" --cluster "$CLUSTER")
        echo "env=$env" >> "$GITHUB_OUTPUT"
        case "$env" in
          skip-paused) echo "::notice::branch $BRANCH is paused: no CI/CD until it is resumed" ;;
          skip-limit)  echo "::notice::the tenant is at its branch limit: $BRANCH waits for a free slot (pause or remove another branch)" ;;
          skip)        echo "::notice::branch $BRANCH is excluded in cicd.yaml" ;;
          branch)      if [ "${{ steps.app.outputs.status }}" = pending ]; then echo "::notice::the app is pending approval: a branch environment only"; fi ;;
        esac

  test:
    needs: route
    if: needs.route.outputs.env != 'manage' && needs.route.outputs.env != 'bump' && needs.route.outputs.env != 'stack' && !startsWith(needs.route.outputs.env, 'skip')
    runs-on: ffwf-k8s
    steps:
    - uses: actions/checkout@v4
      with: {path: .cicd, persist-credentials: false}
    - uses: actions/checkout@v4
      with: {repository: "${{ needs.route.outputs.repo }}", ref: "${{ needs.route.outputs.sha }}", path: app, submodules: recursive,
             token: "${{ secrets.CICD_BOT_TOKEN }}", persist-credentials: false}
    - uses: ./.cicd/actions/setup
    - name: contract defaults
      run: python3 .cicd/tools/intake.py check "app/${{ needs.route.outputs.path }}" --app "${{ inputs.app }}" --dev-branch "${{ needs.route.outputs.dev_branch }}" --fill --quiet
    - uses: ./.cicd/actions/test
      with: {app: "app/${{ needs.route.outputs.path }}"}
    - if: always()
      uses: actions/upload-artifact@v3
      with: {name: ci-result-test, path: ci-result/}

  deliver:
    needs: [route, test]
    if: needs.route.outputs.env == 'dev' || needs.route.outputs.env == 'branch'
    runs-on: ffwf-k8s
    outputs:
      env_dir: ${{ steps.deploy.outputs.env-dir }}
    env:
      APP: app/${{ needs.route.outputs.path }}
    steps:
    - uses: actions/checkout@v4
      with: {path: .cicd, persist-credentials: false}
    - uses: actions/checkout@v4
      with: {repository: "${{ needs.route.outputs.repo }}", ref: "${{ needs.route.outputs.sha }}", path: app, submodules: recursive,
             token: "${{ secrets.CICD_BOT_TOKEN }}", persist-credentials: false}
    - uses: ./.cicd/actions/setup
    - name: contract defaults
      run: python3 .cicd/tools/intake.py check "app/${{ needs.route.outputs.path }}" --app "${{ inputs.app }}" --dev-branch "${{ needs.route.outputs.dev_branch }}" --fill --quiet
    - uses: actions/download-artifact@v3
      continue-on-error: true
      with: {name: ci-result-test, path: build/ci-result-test}
    - id: build
      uses: ./.cicd/actions/build
      with: {app: "${{ env.APP }}", cluster: "${{ env.CLUSTER }}"}
    - id: security
      uses: ./.cicd/actions/security
      with: {app: "${{ env.APP }}", env: "${{ needs.route.outputs.env }}", cluster: "${{ env.CLUSTER }}", image: "${{ steps.build.outputs.image }}",
             token: "${{ secrets.CICD_BOT_TOKEN }}", user: "${{ vars.CICD_BOT_USER }}", commit: "${{ needs.route.outputs.sha }}"}
    - uses: ./.cicd/actions/sign
      with: {image: "${{ steps.build.outputs.image }}", out: build/security}
    - id: sources       # which commit of each source this build is from (docs/enrollment.md)
      env: {SPEC: "${{ needs.route.outputs.sources }}"}
      run: |
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import json, os, subprocess
        out = []
        for x in json.loads(os.environ.get("SPEC") or "[]"):
            p = os.path.normpath(x["path"])      # the submodule's path in the IaC repo
            r = subprocess.run(["git", "-C", "app", "rev-parse", f"HEAD:{p}"], capture_output=True, text=True)
            out.append({"path": x["path"], "repo": x["repo"], "commit": r.stdout.strip() or None})
        print("json=" + json.dumps(out, separators=(",", ":")))
        PY
    - id: manifests     # this environment's overlay if it has one, else the base; prod's is kept for promotion
      run: |
        m="build/app-${{ needs.route.outputs.env }}.yaml"; [ -f "$m" ] || m=build/app.yaml
        echo "path=$m" >> "$GITHUB_OUTPUT"; echo "manifests: $m"
    - id: deploy
      uses: ./.cicd/actions/deploy-env
      with:
        app: ${{ env.APP }}
        cluster: ${{ env.CLUSTER }}
        env: ${{ needs.route.outputs.env }}
        branch: ${{ inputs.branch }}
        image: ${{ steps.build.outputs.image }}
        manifests: ${{ steps.manifests.outputs.path }}
        prod-manifests: build/app-prod.yaml
        token: ${{ secrets.CICD_BOT_TOKEN }}
        user: ${{ vars.CICD_BOT_USER }}
        state-repo: ${{ env.STATE_REPO }}
        commit: ${{ needs.route.outputs.sha }}
        source-repo: ${{ needs.route.outputs.repo }}
        sources: ${{ steps.sources.outputs.json }}
    # endpoint checks (IT Security's findings about the running app) need the new version live:
    # re-assess this environment once it has rolled out
    - if: success()
      env:
        TOKEN: ${{ secrets.CICD_BOT_TOKEN }}
        ENV_DIR: ${{ steps.deploy.outputs.env-dir }}
        NAME: ${{ inputs.app }}
      run: |
        read -r crepo cbranch < <(python3 -c "import yaml,sys;c=yaml.safe_load(open(sys.argv[1])).get('compliance') or {};print(c.get('repo','-'),c.get('branch','main'))" ".cicd/clusters/$CLUSTER/cicd-cluster.yaml")
        ledger=$(curl -fsS -H "Authorization: token $TOKEN" "${{ github.server_url }}/api/v1/repos/$crepo/raw/ledger/$NAME.yaml?ref=$cbranch" 2>/dev/null || true)
        if printf '%s' "$ledger" | grep -q 'type: endpoint'; then
          jq -n --arg app "$NAME" --arg env "$ENV_DIR" '{ref: "master", inputs: {app: $app, env: $env, reason: "after deploy", delay: "90"}}' \
            | curl -fsS -X POST -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' -d @- \
              '${{ github.server_url }}/api/v1/repos/${{ env.STATE_REPO }}/actions/workflows/assess.yaml/dispatches' \
            && echo "asked for an endpoint re-assessment of $NAME/$ENV_DIR in about 90 s"
        fi
    - if: always()
      uses: actions/upload-artifact@v3
      with: {name: deliver, path: "build/security/\nbuild/app*.yaml\nbuild/build-metadata.json"}

  # after the deploy: is it running? (tools/runtime.py, contract.yaml `runtime`) One word as the commit
  # status cicd/runtime; the pod states, events and last log lines it decided from as the artifact
  # `runtime`. Fails when the app doesn't run, so the run is red where the developer looks.
  runtime:
    needs: [route, deliver]
    if: needs.deliver.result == 'success'
    runs-on: ffwf-k8s
    steps:
    - uses: actions/checkout@v4   # the platform repo as it is now: with this deploy's environment
      with: {path: .cicd, ref: "${{ github.ref }}", persist-credentials: false}
    - uses: ./.cicd/actions/setup
    - id: watch
      env:
        RUNTIME_KUBECONFIG: ${{ secrets.CICD_RUNTIME_KUBECONFIG }}
        ENV_DIR: ${{ needs.deliver.outputs.env_dir }}
      run: |
        python3 .cicd/tools/runtime.py watch --root .cicd --cluster "$CLUSTER" --app "${{ inputs.app }}" --env-dir "$ENV_DIR" \
          --sha "${{ needs.route.outputs.sha }}" --out runtime.json --github-output
    - if: always() && steps.watch.outputs.state != ''
      env: {FORGEJO_TOKEN: "${{ secrets.CICD_BOT_TOKEN }}"}
      run: |
        python3 .cicd/tools/runtime.py statuses runtime.json --repo "${{ needs.route.outputs.repo }}" --sha "${{ needs.route.outputs.sha }}" \
          --server "${{ github.server_url }}" --target-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}"
    - if: always()
      uses: actions/upload-artifact@v3
      with: {name: runtime, path: runtime.json}
    - if: steps.watch.outputs.state == 'fail'
      run: exit 1

  # a push to one of the app's sources: move its submodule in the IaC root (docs/enrollment.md). The
  # resulting push to the IaC root is an ordinary push: it builds and deploys through its own run.
  bump:
    needs: route
    if: needs.route.outputs.env == 'bump'
    runs-on: ffwf-k8s
    steps:
    - uses: actions/checkout@v4
      with: {path: .cicd, persist-credentials: false}
    - uses: ./.cicd/actions/setup
    - env: {FORGEJO_TOKEN: "${{ secrets.CICD_BOT_TOKEN }}", BOT: "${{ vars.CICD_BOT_USER }}"}
      run: |
        python3 .cicd/tools/cicd.py --root .cicd bump --app "${{ inputs.app }}" --source "${{ inputs.source }}" \
          --branch "${{ inputs.branch }}" --sha "${{ inputs.sha }}" --actor "${{ inputs.actor }}" --server "${{ github.server_url }}"

  # a stack's dev run (docs/stacks.md): a nested cluster in a free slot of this cluster, from the stack's commit,
  # bootstrapped and checked, then stood down. The lifecycle is the provider's (tools/stack.py), never the stack
  # repo's; the stack's own check script runs inside the nested cluster. Evidence: stacks/<cluster>/<name>/ here.
  stack:
    needs: route
    if: needs.route.outputs.env == 'stack'
    runs-on: ffwf-k8s
    steps:
    - uses: actions/checkout@v4
      with: {path: .cicd, persist-credentials: false}
    - uses: ./.cicd/actions/setup
    - id: run
      env:
        FORGEJO_TOKEN: ${{ secrets.CICD_BOT_TOKEN }}
        BOT: ${{ vars.CICD_BOT_USER }}
        STACK_KUBECONFIG: ${{ secrets.CICD_STACK_KUBECONFIG }}
        REPO: ${{ needs.route.outputs.repo }}
        IPATH: ${{ needs.route.outputs.path }}
        SHA: ${{ inputs.sha }}
        BRANCH: ${{ inputs.branch }}
        SERVER: ${{ github.server_url }}
      run: |
        set -eu
        [ -n "$SHA" ] || SHA=$(curl -fsS -H "Authorization: token $FORGEJO_TOKEN" "$SERVER/api/v1/repos/$REPO/branches/$BRANCH" | jq -r .commit.id)
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        umask 077; printf '%s' "$STACK_KUBECONFIG" > "$RUNNER_TEMP/stack.kubeconfig"
        cfg=$(curl -fsS -H "Authorization: token $FORGEJO_TOKEN" "$SERVER/api/v1/repos/$REPO/raw/$IPATH/cicd.yaml?ref=$SHA")
        args=$(printf '%s' "$cfg" | python3 -c "
        import sys, yaml, shlex, os
        c = yaml.safe_load(sys.stdin.read()); s = c.get('spec') or {}; ck = s.get('check') or {}
        env = (s.get('environments') or {}).get('dev') or {}
        p = os.path.normpath(os.path.join(os.environ['IPATH'], s.get('definition', 'cluster')))
        a = ['--name', c['metadata']['name'], '--definition', p, '--provider', env.get('provider', 'k0s-pod'),
             '--min-kustomizations', str(ck.get('minKustomizations', 2)), '--timeout', str(ck.get('timeout', '900s')).rstrip('s')]
        sm = ck.get('smoke') or {}
        if sm.get('run'):
            a += ['--smoke', os.path.normpath(os.path.join(os.environ['IPATH'], sm['run'])), '--smoke-needs', *(sm.get('needs') or ['api'])]
        print(' '.join(shlex.quote(x) for x in a))")
        rc=0
        eval "KUBECONFIG=$RUNNER_TEMP/stack.kubeconfig python3 .cicd/tools/stack.py lifecycle $args --run '${{ github.run_number }}' \
          --cluster '$CLUSTER' --repo '$REPO' --sha '$SHA' --server '$SERVER' --root .cicd --out stack.json" || rc=$?
        rm -f "$RUNNER_TEMP/stack.kubeconfig"
        echo "word=$(jq -r .word stack.json)" >> "$GITHUB_OUTPUT"
        echo "rc=$rc" >> "$GITHUB_OUTPUT"
    - if: always() && steps.run.outputs.word != ''
      env: {TOKEN: "${{ secrets.CICD_BOT_TOKEN }}", REPO: "${{ needs.route.outputs.repo }}", SHA: "${{ steps.run.outputs.sha }}",
            WORD: "${{ steps.run.outputs.word }}"}
      run: |
        st=failure; [ "$WORD" = ready ] && st=success
        jq -n --arg s "$st" --arg d "$WORD" --arg u '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}' \
          '{state: $s, context: "cicd/stack", description: $d, target_url: $u}' \
          | curl -fsS -o /dev/null -X POST -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' -d @- \
            '${{ github.server_url }}'"/api/v1/repos/$REPO/statuses/$SHA"
    - if: always() && steps.run.outputs.word != ''
      env: {TOKEN: "${{ secrets.CICD_BOT_TOKEN }}", USER: "${{ vars.CICD_BOT_USER }}", SHA: "${{ steps.run.outputs.sha }}"}
      run: |
        set -eu
        name=$(jq -r .stack stack.json); auth="AUTHORIZATION: basic $(printf '%s:%s' "$USER" "$TOKEN" | base64 -w0)"
        st=$(mktemp -d); git -c http.extraHeader="$auth" clone -q --depth 5 '${{ github.server_url }}/${{ env.STATE_REPO }}.git' "$st"
        cd "$st"; git config user.name cicd-bot; git config user.email cicd-bot@noreply.invalid
        for attempt in 1 2 3 4 5; do
          git -c http.extraHeader="$auth" fetch -q origin master && git reset -q --hard origin/master
          d="stacks/$CLUSTER/$name"; mkdir -p "$d/runs"
          jq --arg sha "$SHA" --arg url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}' \
            '. + {commit: $sha, runUrl: $url}' "$GITHUB_WORKSPACE/stack.json" > "$d/runs/${{ github.run_number }}.json"
          cp "$d/runs/${{ github.run_number }}.json" "$d/latest.json"
          ls -1t "$d/runs" | tail -n +21 | sed "s#^#$d/runs/#" | xargs -r rm -f     # the last 20 runs
          git add stacks
          git commit -q -m "stack $name: $(jq -r .word "$d/latest.json") at ${SHA:0:7}" -m '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}'
          git -c http.extraHeader="$auth" push -q origin HEAD:master && break
          [ "$attempt" = 5 ] && exit 1; sleep $((attempt * 3))
        done
    - if: always()
      uses: actions/upload-artifact@v3
      with: {name: stack, path: stack.json}
    - if: steps.run.outputs.rc != '0'
      run: exit 1

  # self-service, for whoever the dashboard says asked (it checked their write on the app repo)
  manage:
    needs: route
    if: needs.route.outputs.env == 'manage'
    runs-on: ffwf-k8s
    steps:
    - uses: actions/checkout@v4
      with: {path: .cicd, persist-credentials: false}
    - uses: actions/checkout@v4
      with: {repository: "${{ needs.route.outputs.repo }}", ref: "${{ needs.route.outputs.sha }}", path: app, submodules: recursive,
             token: "${{ secrets.CICD_BOT_TOKEN }}", persist-credentials: false}
    - uses: ./.cicd/actions/setup
    - name: contract defaults
      run: python3 .cicd/tools/intake.py check "app/${{ needs.route.outputs.path }}" --app "${{ inputs.app }}" --dev-branch "${{ needs.route.outputs.dev_branch }}" --fill --quiet
    - if: inputs.action == 'request-promotion'
      uses: ./.cicd/actions/request-promotion
      with:
        app: ${{ inputs.app }}
        not-before: ${{ inputs.not_before }}
        reason: ${{ inputs.reason }}
        requested-by: ${{ inputs.actor || github.actor }}
        cluster: ${{ env.CLUSTER }}
        token: ${{ secrets.CICD_BOT_TOKEN }}
        user: ${{ vars.CICD_BOT_USER }}
        state-repo: ${{ env.STATE_REPO }}
    - if: inputs.action != 'request-promotion'
      uses: ./.cicd/actions/manage-env
      with:
        action: ${{ inputs.action }}
        app: app/${{ needs.route.outputs.path }}
        branch: ${{ inputs.branch }}
        by: ${{ inputs.actor || github.actor }}
        cluster: ${{ env.CLUSTER }}
        token: ${{ secrets.CICD_BOT_TOKEN }}
        user: ${{ vars.CICD_BOT_USER }}
        state-repo: ${{ env.STATE_REPO }}
        source-repo: ${{ needs.route.outputs.repo }}

# Every app environment CI has rendered for this cluster (envs/c-local/kustomization.yaml is
# generated by tools/cicd.py). prune: deleting an environment's directory deletes its namespace.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: cicd-envs, namespace: flux-system}
spec:
  dependsOn: [{name: gateway}]
  interval: 10m
  retryInterval: 30s
  path: ./envs/c-local
  prune: true
  wait: false               # an environment at zero replicas is healthy; don't wait on pods
  timeout: 5m
  sourceRef: {kind: GitRepository, name: cicd-ref-arch}

# The platform layer for this cluster, in dependency order:
#   cicd-sources -> gateway-api -> traefik -> keda -> keda-http -> gateway
#   cicd-sources -> buildkit
#   runtime (read-only access for the pipeline's runtime check)
#   stacks (slots for nested clusters: docs/stacks.md)
# Assumes the cluster already has cert-manager with ClusterIssuer ${CLUSTER_ISSUER}, and a CNI
# that enforces NetworkPolicy.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: cicd-sources, namespace: flux-system}
spec:
  interval: 30m
  retryInterval: 30s
  path: ./platform/sources
  prune: true
  wait: true
  timeout: 5m
  sourceRef: {kind: GitRepository, name: cicd-ref-arch}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: gateway-api, namespace: flux-system}
spec:
  dependsOn: [{name: cicd-sources}]
  interval: 30m
  retryInterval: 30s
  path: ./config/crd/standard
  prune: false              # never delete CRDs (and every route with them) on a path mistake
  wait: true
  timeout: 5m
  sourceRef: {kind: GitRepository, name: gateway-api}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: traefik, namespace: flux-system}
spec:
  dependsOn: [{name: gateway-api}]
  interval: 30m
  retryInterval: 30s
  path: ./platform/traefik
  prune: true
  wait: true
  timeout: 10m
  sourceRef: {kind: GitRepository, name: cicd-ref-arch}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: keda, namespace: flux-system}
spec:
  dependsOn: [{name: cicd-sources}]
  interval: 30m
  retryInterval: 30s
  path: ./platform/keda
  prune: true
  wait: true
  timeout: 10m
  sourceRef: {kind: GitRepository, name: cicd-ref-arch}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: keda-http, namespace: flux-system}
spec:
  dependsOn: [{name: keda}]
  interval: 30m
  retryInterval: 30s
  path: ./platform/keda-http
  prune: true
  wait: true
  timeout: 10m
  sourceRef: {kind: GitRepository, name: cicd-ref-arch}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: gateway, namespace: flux-system}
spec:
  dependsOn: [{name: traefik}, {name: keda-http}]
  interval: 10m
  retryInterval: 30s
  path: ./platform/gateway
  prune: true
  wait: true
  timeout: 10m
  sourceRef: {kind: GitRepository, name: cicd-ref-arch}
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: cicd-vars}]
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: buildkit, namespace: flux-system}
spec:
  dependsOn: [{name: cicd-sources}]
  interval: 30m
  retryInterval: 30s
  path: ./platform/buildkit
  prune: true
  wait: true
  timeout: 10m
  sourceRef: {kind: GitRepository, name: cicd-ref-arch}
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: cicd-vars}]
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: cicd-runtime, namespace: flux-system}
spec:
  interval: 30m
  retryInterval: 30s
  path: ./platform/runtime
  prune: true
  wait: true
  timeout: 5m
  sourceRef: {kind: GitRepository, name: cicd-ref-arch}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: cicd-stacks, namespace: flux-system}
spec:
  interval: 30m
  retryInterval: 30s
  path: ./platform/stacks
  prune: true
  wait: true
  timeout: 5m
  sourceRef: {kind: GitRepository, name: cicd-ref-arch}

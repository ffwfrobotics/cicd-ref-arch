# The controller makes and removes sessions (pod, ConfigMap, Secret) in factory-sessions, and nothing
# anywhere else. Session pods mount no service account token.
apiVersion: v1
kind: ServiceAccount
metadata: {name: controller, namespace: factory}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: factory-controller, namespace: factory-sessions}
rules:
- apiGroups: [""]
  resources: [pods, configmaps, secrets]
  verbs: [get, list, create, delete]
- apiGroups: [""]
  resources: [pods/log]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: factory-controller, namespace: factory-sessions}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: factory-controller}
subjects: [{kind: ServiceAccount, name: controller, namespace: factory}]

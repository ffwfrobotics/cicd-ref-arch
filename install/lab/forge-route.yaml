# The forge through the platform's gateway (Traefik), once the gateway exists: its own Gateway and
# certificate, since forge.${ZONE} isn't under the apps' wildcard *.${CLUSTER}.${ZONE}.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: forge, namespace: forgejo}
spec:
  secretName: forge-tls
  issuerRef: {kind: ClusterIssuer, name: lab-ca}
  dnsNames: ["${FORGE_HOST}"]
  privateKey: {algorithm: ECDSA, size: 256}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: forge, namespace: forgejo}
spec:
  gatewayClassName: traefik
  listeners:
  - name: https
    protocol: HTTPS
    port: 8443
    hostname: "${FORGE_HOST}"
    tls: {mode: Terminate, certificateRefs: [{name: forge-tls}]}
    allowedRoutes: {namespaces: {from: Same}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: forge, namespace: forgejo}
spec:
  parentRefs: [{name: forge, sectionName: https}]
  hostnames: ["${FORGE_HOST}"]
  rules:
  - backendRefs: [{name: forgejo-http, port: 3000}]

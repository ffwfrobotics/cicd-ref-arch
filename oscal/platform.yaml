# Layer 1 of 3: what the cicd-ref-arch pipeline implements for every enrolled app, per SP 800-53A
# objective, and which record proves it (an "evidence selector", docs/oscal.md). tools/oscal.py
# compiles this to an OSCAL component-definition and evaluates it per commit. The app's own layer
# (oscal/component.yaml in its repo, optional) and the owner's sysadmin layer (apps/<app>/
# component.yaml in the compliance repo) are merged over it, in that order, objective by objective.
component: cicd-ref-arch
title: cicd-ref-arch pipeline (build, scan, gate, deploy, promote)
type: service
description: >-
  Every push is tested, built, scanned (gitleaks, opengrep, checkov, syft, grype), gated by policy
  and deployed from git; prod changes only through a two-person promotion that re-scans the image.
objectives:
  # CM-2 Baseline configuration
  cm-2_obj.a-1:
    statement: The rendered manifests and the image digest of every environment are written to git by the pipeline.
    evidence: [{kind: manifests}]
  cm-2_obj.a-2:
    statement: The baseline changes only through commits (app repo, then state repo); images are pinned by digest.
    evidence: [{kind: config-control}]
  cm-2_obj.b.3:
    statement: Installing or upgrading a component is a commit, which re-renders and re-records the baseline.
    evidence: [{kind: config-control}, {kind: manifests}]
  # CM-8 System component inventory
  cm-8_obj.a.1:
    statement: syft inventories the built image itself, so the inventory is what runs.
    evidence: [{kind: sbom}]
  cm-8_obj.a.2:
    statement: The SBOM covers every package in the image (OS and language packages).
    evidence: [{kind: sbom}]
  cm-8_obj.a.3:
    statement: One SBOM per image digest, per application; nothing is shared or counted twice.
    evidence: [{kind: sbom}]
  cm-8_obj.a.4:
    statement: Package level, with purl, version and licence (CycloneDX and SPDX).
    evidence: [{kind: sbom}]
  cm-8_obj.a.5:
    statement: Each component has name, version, purl and licence where the package declares one.
    evidence: [{kind: sbom}]
  cm-8_obj.b:
    statement: The inventory is regenerated on every build, and re-checked daily against new advisories.
    evidence: [{kind: sbom}, {kind: vuln-db, max_age_h: 48}]
  # RA-5 Vulnerability monitoring and scanning
  ra-5_obj.a-1:
    statement: The SBOM of every live image is re-matched when the vulnerability database updates (daily) or an advisory arrives.
    evidence: [{kind: vuln-db, max_age_h: 48}]
  ra-5_obj.a-2:
    statement: Every push is scanned; prod is re-scanned at promotion request and again at apply.
    evidence: [{kind: scan, tool: grype}, {kind: scan, tool: opengrep}, {kind: scan, tool: checkov}]
  ra-5_obj.b.1:
    statement: Scanning, normalisation and the gate decision are automatic, per commit.
    evidence: [{kind: gate}]
  ra-5_obj.b.2:
    statement: Findings are normalised to one record format with CVE ids and purls (security-findings/v1).
    evidence: [{kind: scan, tool: grype}, {kind: sbom}]
  ra-5_obj.b.3:
    statement: Configuration is checked with checkov's rule set and code with opengrep rules kept in git.
    evidence: [{kind: scan, tool: checkov}, {kind: scan, tool: opengrep}]
  ra-5_obj.c:
    statement: Each finding gets an outcome (fail, suppressed with reason and expiry, below threshold, no fix) in the gate record.
    evidence: [{kind: gate}]
  ra-5_obj.d:
    statement: A vulnerability with a fix blocks prod until it is fixed or recorded as not affecting the app.
    evidence: [{kind: findings, category: vuln}, {kind: findings, category: external}]
  ra-5_obj.e:
    statement: The owner releases assessment packages to IT Security from the dashboard (release log in the compliance repo).
    evidence: [{kind: release, within_days: 30}]
  ra-5_obj.f:
    statement: grype's database is refreshed daily and its build time is recorded with every scan.
    evidence: [{kind: vuln-db, max_age_h: 48}]
  # SA-11 Developer testing and evaluation
  sa-11_obj.a-2:
    statement: The pipeline runs the security assessment on every commit of every branch.
    evidence: [{kind: scan, tool: grype}, {kind: ci-result, job: security}]
  sa-11_obj.b:
    statement: Unit tests and static, configuration, secret and vulnerability scans on every commit.
    evidence: [{kind: ci-result, job: test}, {kind: ci-result, job: security}]
  sa-11_obj.c-1:
    statement: Each job writes a ci-result/v1 record; the run log is kept by the forge.
    evidence: [{kind: ci-result, job: test}, {kind: ci-result, job: security}]
  sa-11_obj.c-2:
    statement: Results are recorded per commit next to the environment they produced.
    evidence: [{kind: ci-result, job: test}, {kind: gate}]
  sa-11_obj.d:
    statement: Suppressions need a reason and an expiry, are versioned with the code, and show as a diff in every promotion.
    evidence: [{kind: gate}]
  sa-11_obj.e:
    statement: Findings at or above the threshold block prod until corrected.
    evidence: [{kind: findings, category: all}]
  # SI-2 Flaw remediation
  si-2_obj.a-1:
    statement: Flaws are identified by the scans of every commit and by imported findings.
    evidence: [{kind: scan, tool: grype}, {kind: scan, tool: opengrep}, {kind: scan, tool: checkov}]
  si-2_obj.a-2:
    statement: Flaws are reported in the run, the gate record and the dashboard.
    evidence: [{kind: gate}, {kind: ci-result, job: security}]
  si-2_obj.a-3:
    statement: Flaws that block prod are corrected before promotion.
    evidence: [{kind: findings, category: all}]
  si-2_obj.b-1:
    statement: A fix is a commit; it is tested before it is deployed anywhere.
    evidence: [{kind: ci-result, job: test}]
  si-2_obj.b-2:
    statement: The same tests run on the fix, in a dev or branch environment before prod.
    evidence: [{kind: ci-result, job: test}]
  si-2_obj.b-3:
    not-applicable: Containers carry no firmware; host firmware belongs to the hosting system's plan (leveraged).
  si-2_obj.b-4:
    not-applicable: Containers carry no firmware; host firmware belongs to the hosting system's plan (leveraged).
  si-2_obj.c-1:
    statement: Security updates with a fix block prod until installed (rebuilt and promoted).
    evidence: [{kind: findings, category: vuln}]
  si-2_obj.c-2:
    not-applicable: Containers carry no firmware; host firmware belongs to the hosting system's plan (leveraged).
  si-2_obj.d:
    statement: Every fix is a commit through the same pipeline and promotion as any change.
    evidence: [{kind: config-control}]
  # IA-5(7) No embedded unencrypted static authenticators
  ia-5.7_obj:
    statement: gitleaks on every commit, and the forge refuses pushes that add a secret (pre-receive hook).
    evidence:
    - {kind: findings, category: secrets}
    - kind: attested
      name: forge-pre-receive-gitleaks
      by: arecibo-ffwf-goblincorps-hosting, authorised by john
      at: 2026-11-20
      expires: 2027-05-20
      note: gitleaks 8.30.1 in hooks/pre-receive.d of every enrolled repo on forge.goblincorps.com; smoke-tested
